# Break-glass: the one documented emergency path into prod. See docs/compliance/dora-art17.md.
#
# It needs an incident reference, runs in the `prod-breakglass` environment (its own reviewers, main-only
# branches, its own identity with prod apply rights), plans and applies in one job and always opens an
# issue asking for approval after the fact (DORA RTS 2024/1774 Art. 17(1)(g)).
#
# By design this path has no guard step: stop-the-line is intentionally not enforced here, because an
# emergency fix must be able to ship while an earlier stage is red. A failed apply does open the
# stop-the-line issue for prod (it carries the apply-failed label, so nightly drift skips prod).
# The prod-breakglass reviewers approve before the plan exists, so the policy pack runs here (stage prod,
# deny rules fail the run) as the machine check standing in for the review of the plan; Trivy is not run.
# The post-approval issue is the record.
#
# gate_mechanism: workflow (D15, issue #40), read from main: there are no environment reviewers to
# wait for, so this run is the REQUEST half of break-glass. The `request` job plans the whole prod
# tree in prod-plan (the plan identity, never the apply one), runs the policy pack, checks the
# rollback rule and keeps the encrypted plan, its manifest and request.json (incident, sha,
# allow-rollback, counts) as the artifact ayasee-breakglass-plan-<sha>; `request-issue` (no
# environment, no secret) opens an ayasee:breakglass-approval issue with the manifest digest. A
# login of reviewers.breakglass of main, who is not the requester, then applies exactly that plan
# with iac-approve and the incident (docs/compliance/dora-art17.md). Main must list
# reviewers.breakglass; nothing here applies anything.
#
# Break-glass always plans and applies the whole prod tree (R71): unchanged units are no-ops, so the
# ledger record of prod stays truthful for every unit.
#
# The sha input must be an ancestor of origin/main (a reviewed, merged commit); anything else is refused
# before the plan. A sha older than the commit live in prod (a rollback) is refused unless allow-rollback
# is true. The configuration is read from that sha. Plan encryption and the state lock timeout are the same
# as for the normal prod stage. AYASEE_LEDGER_URL must be set on the prod-breakglass environment.
#
# Lines marked AYASEE_REF are placeholders (all-zero SHA, owner OWNER): scripts/set-ayasee-ref.sh
# rewrites them at release. The `--local` (./actions) form is not supported for this workflow: the job
# checks out the sha to deploy, and that checkout would replace ./actions. This file is not callable
# before the release rewrite.
#
# Environment names: every GitHub environment below is `environment_prefix` of .ayasee.yaml plus the
# name written here (dev, prod-plan, prod, drift-<stage>, ...), named by an output of the first job.
# No job names an environment by a literal; docs/reference/ayasee-yaml.md#environment-names.
name: iac-breakglass

on:
  workflow_call:
    inputs:
      tool-mirror:
        description: >-
          Optional https base URL (no trailing slash) replacing https://github.com for tool
          downloads (GitHub Enterprise Server or offline runners). SHA-256 checks still apply.
        type: string
        required: false
        default: ""
      incident:
        description: Incident reference, like ABC-123 or INC123.
        type: string
        required: true
      sha:
        description: Full 40-character commit SHA to deploy; it must be an ancestor of origin/main.
        type: string
        required: true
      allow-rollback:
        description: "true allows a sha older than the commit live in prod (a rollback). Anything but true or false is refused."
        type: string
        required: false
        default: "false"
      config-path:
        description: Path of the ayasee configuration file.
        type: string
        required: false
        default: .ayasee.yaml
    secrets:
      teams-webhook:
        description: Optional Teams incoming-webhook URL for notifications.
        required: false
      ledger-token:
        description: Optional fine-grained token (contents write on the repository) for a git-branch:// ledger store.
        required: false
      AYASEE_LEDGER_AWS_ACCESS_KEY_ID:
        description: >-
          Only for an s3:// ledger (experimental). Access key id of a key dedicated to the
          ledger, never the state key: s3:GetObject and s3:PutObject on the ledger prefix and s3:ListBucket on it, nothing else. Pass it by name and create
          it as an environment secret of prod-breakglass, never at repository or organisation level.
          Only the guard and ledger steps receive it, as AWS_ACCESS_KEY_ID.
        required: false
      AYASEE_LEDGER_AWS_SECRET_ACCESS_KEY:
        description: >-
          Only for an s3:// ledger. The secret access key that goes with
          AYASEE_LEDGER_AWS_ACCESS_KEY_ID; same rules.
        required: false
      AYASEE_PLAN_PASSPHRASE:
        description: >-
          Only for plan_encryption.key_provider pbkdf2. Pass it by name
          (AYASEE_PLAN_PASSPHRASE set to secrets.AYASEE_PLAN_PASSPHRASE) and create it as an
          environment secret of prod-plan, prod and prod-breakglass only, never at repository or
          organisation level: the environment secret takes precedence in those jobs. Only the
          prod plan and apply steps receive it.
        required: false
      AYASEE_KMS_ACCESS_KEY_ID:
        description: >-
          Only for plan_encryption.key_provider aws_kms. Access key id (AKIA...) of an IAM user
          whose only permission is kms:GenerateDataKey and kms:Decrypt on the AYASEE_KMS_KEY_ID
          key. Pass it by name and create it as an environment secret of prod-plan, prod and
          prod-breakglass only, never at repository or organisation level. Only the prod plan and
          apply steps receive it.
        required: false
      AYASEE_KMS_SECRET_ACCESS_KEY:
        description: >-
          Only for plan_encryption.key_provider aws_kms. The secret access key that goes with
          AYASEE_KMS_ACCESS_KEY_ID; same rules.
        required: false
      AYASEE_GCP_KMS_CREDENTIALS:
        description: >-
          Only for plan_encryption.key_provider gcp_kms. JSON key file of a Google service account
          whose only role is Cloud KMS CryptoKey Encrypter/Decrypter on the AYASEE_GCP_KMS_KEY_NAME
          key. Pass it by name and create it as an environment secret of prod-plan, prod and
          prod-breakglass only, never at repository or organisation level. Only the prod plan and
          apply steps receive it.
        required: false
      AYASEE_OPENBAO_TOKEN:
        description: >-
          Only for plan_encryption.key_provider openbao. OpenBao token whose only policy allows
          update on <transit mount>/datakey/plaintext/<key> and <transit mount>/decrypt/<key> of
          the AYASEE_OPENBAO_KEY_URL key. Pass it by name and create it as an environment secret of
          prod-plan, prod and prod-breakglass only, never at repository or organisation level. Only
          the prod plan and apply steps receive it.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: >-
          identity: secrets only. Pass it by name and create it as an environment secret of
          prod-breakglass, never at repository or organisation level;
          only the plan and apply steps receive it.
        required: false
      AWS_ACCESS_KEY_ID:
        description: >-
          identity: secrets only. Pass it by name and create it as an environment secret of
          prod-breakglass, never at repository or organisation level;
          only the plan and apply steps receive it.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: >-
          identity: secrets only. Pass it by name and create it as an environment secret of
          prod-breakglass, never at repository or organisation level;
          only the plan and apply steps receive it.
        required: false
      AYASEE_PROVIDER_ENV:
        description: >-
          identity: secrets only. More provider variables (OVH, Hetzner, Scaleway, a second
          Cloudflare account through TF_VAR_*) as one JSON object of name to string value, for
          example {"HCLOUD_TOKEN": "..."}. Every name must be declared in provider_env in
          .ayasee.yaml; reserved names (PATH, LD_*, GITHUB_*, TF_* except TF_VAR_*, AWS_*,
          CLOUDFLARE_*, ...) and values under 16 characters are refused. Pass it
          by name and create it as an environment secret of each stage environment, never at
          repository or organisation level; only the plan and apply steps receive it, and each
          value is masked.
        required: false
      extra-env-secret:
        description: >-
          Optional secret exported as AYASEE_EXTRA_SECRET to the plan and apply steps only (so
          Terragrunt hooks can read it). Sandbox-only escape hatch for the e2e fixture's state
          sync; leave it unset in real repositories.
        required: false
  workflow_dispatch:
    inputs:
      incident:
        description: Incident reference, like ABC-123 or INC123.
        type: string
        required: true
      sha:
        description: Full 40-character commit SHA to deploy; it must be an ancestor of origin/main.
        type: string
        required: true
      allow-rollback:
        description: "true allows a sha older than the commit live in prod (a rollback). Anything but true or false is refused."
        type: string
        required: false
        default: "false"
      config-path:
        description: Path of the ayasee configuration file.
        type: string
        required: false
        default: .ayasee.yaml

permissions: {}

jobs:
  validate:
    # nothing else runs unless the inputs are well formed
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # read environment_prefix from main
      actions: read # the prod-breakglass environment and its protection rules
    outputs:
      incident: ${{ steps.validate.outputs.incident }}
      sha: ${{ steps.validate.outputs.sha }}
      allow-rollback: ${{ steps.validate.outputs.allow-rollback }}
      environment-prefix: ${{ steps.prefix.outputs.environment-prefix }}
      gate-mechanism: ${{ steps.prefix.outputs.gate-mechanism }}
      ledger-url: ${{ steps.prefix.outputs.ledger-url }}
    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || {
            echo "::error::break-glass runs only from refs/heads/main, not $REF"
            exit 1
          }
      - id: validate
        name: Validate the incident, the sha and allow-rollback
        env:
          INCIDENT: ${{ inputs.incident }}
          SHA: ${{ inputs.sha }}
          ALLOW_ROLLBACK: ${{ inputs.allow-rollback }}
        run: |
          export LC_ALL=C
          [[ "$INCIDENT" =~ ^[A-Z]+-[0-9]+$ ]] || [[ "$INCIDENT" =~ ^INC[0-9]+$ ]] || {
            echo "::error::incident must look like ABC-123 or INC123"
            exit 1
          }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::sha must be a full 40-character lowercase commit SHA"
            exit 1
          }
          case "$ALLOW_ROLLBACK" in true | false) ;; *)
            echo "::error::allow-rollback must be true or false"
            exit 1 ;;
          esac
          {
            echo "allow-rollback=$ALLOW_ROLLBACK"
            echo "incident=$INCIDENT"
            echo "sha=$SHA"
          } >>"$GITHUB_OUTPUT"
      # The environment of the break-glass job is named before that job can check anything out, so
      # it comes from the configuration of main (this run's ref), not from the commit to deploy: an
      # old commit predating environment_prefix must still run in the environment that exists now.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: tttao/ayasee/actions/setup@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: prefix
        name: Read environment_prefix and the gate from main
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          ayasee config show --path "$CONFIG_PATH" >"$RUNNER_TEMP/ayasee-config.json"
          cfg="$RUNNER_TEMP/ayasee-config.json"
          gate="$(jq -er '.gate_mechanism' "$cfg")"
          {
            echo "environment-prefix=$(jq -r '.environment_prefix' "$cfg")"
            echo "gate-mechanism=$gate"
            echo "ledger-url=$(jq -r '.ledger.url // ""' "$cfg")"
          } >>"$GITHUB_OUTPUT"
          # D15: with gate_mechanism: workflow there are no environment reviewers; a login of
          # reviewers.breakglass of main approves the plan with iac-approve, so main must list one
          if [ "$gate" = workflow ]; then
            n="$(jq -er '.reviewers.breakglass | length' "$cfg")"
            [ "$n" -gt 0 ] || {
              echo "::error::gate_mechanism: workflow, but reviewers.breakglass of .ayasee.yaml on main is empty: nobody could approve a break-glass request. Add it by a pull request (a change of the gate settings, approved like a prod change)"
              exit 1
            }
          fi
      # issue #39: the break-glass job is gated only by the reviewers of its environment; without
      # them (none set, not created yet, or a plan that ignores them) it would apply unapproved.
      # Anything but workflow (an empty output included) keeps this check.
      - name: Refuse a break-glass environment without required reviewers
        if: ${{ steps.prefix.outputs.gate-mechanism != 'workflow' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ steps.prefix.outputs.environment-prefix }}
        run: |
          err="$RUNNER_TEMP/ayasee-require-reviewers.err"
          if ! notes="$(ayasee require-reviewers --repo "$REPO" --environment "${PREFIX}prod-breakglass" 2>"$err")"; then
            while IFS= read -r line; do
              case "$line" in require-reviewers:*) echo "::error::${line#require-reviewers: }" ;; *) echo "$line" ;; esac
            done <"$err"
            exit 1
          fi
          [ -z "$notes" ] || while IFS= read -r line; do echo "::notice::$line"; done <<<"$notes"

  breakglass:
    # plan and apply in one job behind the prod-breakglass reviewers (the environment gate)
    name: breakglass
    needs: validate
    if: ${{ needs.validate.outputs.gate-mechanism != 'workflow' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment-prefix }}prod-breakglass
    permissions:
      id-token: write # OIDC login to Azure and Databricks
      contents: read # check out the code
      deployments: write # mirror the ledger as a GitHub deployment
      issues: write # the post-approval issue
      actions: read # approvals of this run
    concurrency:
      group: ayasee-${{ github.repository }}-prod
      cancel-in-progress: false
    env:
      AYASEE_LEDGER_URL: ${{ vars.AYASEE_LEDGER_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Require a ledger URL
        run: |
          [ -n "$AYASEE_LEDGER_URL" ] || {
            echo "::error::no ledger URL: set AYASEE_LEDGER_URL as a variable on the prod-breakglass environment (with its environment_prefix)"
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a commit that is not on main
        env:
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null || {
            echo "::error::origin/main was not fetched; cannot check that $SHA is on main"
            exit 1
          }
          rc=0
          git merge-base --is-ancestor "$SHA" origin/main || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error::$SHA is not an ancestor of origin/main; break-glass only deploys reviewed, merged commits"
               exit 1 ;;
            *) echo "::error::cannot check whether $SHA is on main (git exit $rc)"
               exit 1 ;;
          esac
      - uses: tttao/ayasee/actions/setup@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Refuse settings that are not supported yet (R35, R73)
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ! problems="$(ayasee config check-supported --path "$CONFIG_PATH" 2>&1)"; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
      - name: Label deviations from the compliant defaults
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          # identity: secrets (D7) and solo_mode (D2) are opt-ins that weaken a default; say so
          labels="$(ayasee config labels --path "$CONFIG_PATH")"
          [ -n "$labels" ] || exit 0
          while IFS= read -r line; do
            echo "::warning::$line"
            echo "> **$line**" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$labels"
      - id: cfg
        name: Read the configuration
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          MAIN_PREFIX: ${{ needs.validate.outputs.environment-prefix }}
        run: |
          ayasee config show --path "$CONFIG_PATH" >"$RUNNER_TEMP/ayasee-config.json"
          cfg="$RUNNER_TEMP/ayasee-config.json"
          {
            echo "units-root=$(jq -r '.units_root' "$cfg")"
            echo "engine=$(jq -r '.engine' "$cfg")"
            echo "identity=$(jq -r '.identity' "$cfg")"
            echo "provider-env-names=$(jq -r '.provider_env | join(",")' "$cfg")"
            echo "key-provider=$(jq -r '.plan_encryption.key_provider' "$cfg")"
            echo "shared-units=$(jq -r '.shared_units | join(",")' "$cfg")"
            echo "environment-prefix=$(jq -r '.environment_prefix' "$cfg")"
          } >>"$GITHUB_OUTPUT"
          if [ "$(jq -r '.environment_prefix' "$cfg")" != "$MAIN_PREFIX" ]; then
            echo "::warning::environment_prefix of this commit differs from main's; the job runs in main's environments (${MAIN_PREFIX}prod-breakglass)"
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: ${{ steps.cfg.outputs.identity == 'oidc' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: live
        name: Refuse a rollback unless allow-rollback is true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AYASEE_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          GIT_CONFIG_COUNT: ${{ secrets.ledger-token && '1' || '0' }}
          GIT_CONFIG_KEY_0: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$AYASEE_LEDGER_TOKEN"; }; f'
          AWS_ACCESS_KEY_ID: ${{ secrets.AYASEE_LEDGER_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AYASEE_LEDGER_AWS_SECRET_ACCESS_KEY }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.validate.outputs.sha }}
          ALLOW_ROLLBACK: ${{ needs.validate.outputs.allow-rollback }}
        run: |
          ayasee ledger show --store "$AYASEE_LEDGER_URL" --repo "$REPO" --env prod \
            >"$RUNNER_TEMP/ledger-prod.json"
          live="$(jq -r '.sha // ""' "$RUNNER_TEMP/ledger-prod.json")"
          if [ -z "$live" ]; then
            echo "::notice::no ledger record for prod; first deploy, no rollback check"
            echo "rollback-from=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$live" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::the ledger record of prod has no valid commit SHA"
            exit 1
          }
          git cat-file -e "$live^{commit}" 2>/dev/null || {
            echo "::error::the commit live in prod ($live) is not in this repository's history"
            exit 1
          }
          rc=0
          git merge-base --is-ancestor "$live" "$SHA" || rc=$?
          case "$rc" in
            0) echo "rollback-from=" >>"$GITHUB_OUTPUT" ;;
            1)
              [ "$ALLOW_ROLLBACK" = true ] || {
                echo "::error::$SHA is older than the commit live in prod (${live:0:12}); set allow-rollback to true to roll back"
                exit 1
              }
              echo "::warning::rollback from ${live:0:12} to ${SHA:0:12}: the target is older than the commit live in prod"
              echo "rollback-from=$live" >>"$GITHUB_OUTPUT" ;;
            *)
              echo "::error::cannot compare $SHA with the live commit (git exit $rc)"
              exit 1 ;;
          esac
      - id: approver
        name: Read the approvers (fails when there are none)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BREAKGLASS_ENV: ${{ needs.validate.outputs.environment-prefix }}prod-breakglass
        run: |
          login="$(ayasee approvals list --repo "$REPO" --run-id "$RUN_ID" --env "$BREAKGLASS_ENV")"
          echo "login=$login" >>"$GITHUB_OUTPUT"
      - id: plan
        uses: tttao/ayasee/actions/plan@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          env: prod
          units-root: ${{ steps.cfg.outputs.units-root }}
          engine: ${{ steps.cfg.outputs.engine }}
          encrypt: "true"
          binding-mode: breakglass
          breakglass-incident: ${{ needs.validate.outputs.incident }}
          shared-units: ${{ steps.cfg.outputs.shared-units }}
          lock-timeout: 10m
          expect-sha: "true" # fail unless the checkout really is the sha to deploy
          key-provider: ${{ steps.cfg.outputs.key-provider }}
          key-vault-key-id: ${{ vars.AYASEE_KEY_VAULT_KEY_ID }}
          kms-key-id: ${{ vars.AYASEE_KMS_KEY_ID }}
          gcp-kms-key-name: ${{ vars.AYASEE_GCP_KMS_KEY_NAME }}
          openbao-key-url: ${{ vars.AYASEE_OPENBAO_KEY_URL }}
        env:
          AYASEE_EXTRA_SECRET: ${{ secrets.extra-env-secret }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AYASEE_PROVIDER_ENV: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AYASEE_PROVIDER_ENV || '' }}
          AYASEE_PROVIDER_ENV_NAMES: ${{ steps.cfg.outputs.provider-env-names }}
          AYASEE_PLAN_PASSPHRASE: ${{ secrets.AYASEE_PLAN_PASSPHRASE }} # pbkdf2 only
          AYASEE_KMS_ACCESS_KEY_ID: ${{ secrets.AYASEE_KMS_ACCESS_KEY_ID }} # aws_kms only
          AYASEE_KMS_SECRET_ACCESS_KEY: ${{ secrets.AYASEE_KMS_SECRET_ACCESS_KEY }} # aws_kms only
          AYASEE_GCP_KMS_CREDENTIALS: ${{ secrets.AYASEE_GCP_KMS_CREDENTIALS }} # gcp_kms only
          AYASEE_OPENBAO_TOKEN: ${{ secrets.AYASEE_OPENBAO_TOKEN }} # openbao only
          SG_SHA: ${{ needs.validate.outputs.sha }}
          # identity: oidc (default) is the Entra OIDC profile; identity: secrets sets none of these
          ARM_USE_OIDC: ${{ steps.cfg.outputs.identity == 'oidc' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_CLIENT_ID || '' }}
          ARM_TENANT_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_TENANT_ID || '' }}
          ARM_SUBSCRIPTION_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_SUBSCRIPTION_ID || '' }}
          DATABRICKS_AUTH_TYPE: ${{ steps.cfg.outputs.identity == 'oidc' && 'github-oidc-azure' || '' }}
      - uses: tttao/ayasee/actions/policy@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          plan-json: ${{ steps.plan.outputs.json-dir }}
          stage: prod
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: apply
        uses: tttao/ayasee/actions/apply@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        env:
          AYASEE_EXTRA_SECRET: ${{ secrets.extra-env-secret }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AYASEE_PROVIDER_ENV: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AYASEE_PROVIDER_ENV || '' }}
          AYASEE_PROVIDER_ENV_NAMES: ${{ steps.cfg.outputs.provider-env-names }}
          AYASEE_PLAN_PASSPHRASE: ${{ secrets.AYASEE_PLAN_PASSPHRASE }} # pbkdf2 only
          AYASEE_KMS_ACCESS_KEY_ID: ${{ secrets.AYASEE_KMS_ACCESS_KEY_ID }} # aws_kms only
          AYASEE_KMS_SECRET_ACCESS_KEY: ${{ secrets.AYASEE_KMS_SECRET_ACCESS_KEY }} # aws_kms only
          AYASEE_GCP_KMS_CREDENTIALS: ${{ secrets.AYASEE_GCP_KMS_CREDENTIALS }} # gcp_kms only
          AYASEE_OPENBAO_TOKEN: ${{ secrets.AYASEE_OPENBAO_TOKEN }} # openbao only
          SG_SHA: ${{ needs.validate.outputs.sha }} # the sha that was checked out, not the dispatching ref's
          ARM_USE_OIDC: ${{ steps.cfg.outputs.identity == 'oidc' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_CLIENT_ID || '' }}
          ARM_TENANT_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_TENANT_ID || '' }}
          ARM_SUBSCRIPTION_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_SUBSCRIPTION_ID || '' }}
          DATABRICKS_AUTH_TYPE: ${{ steps.cfg.outputs.identity == 'oidc' && 'github-oidc-azure' || '' }}
        with:
          env: prod
          units-root: ${{ steps.cfg.outputs.units-root }}
          engine: ${{ steps.cfg.outputs.engine }}
          binding-mode: breakglass
          breakglass-incident: ${{ needs.validate.outputs.incident }}
          lock-timeout: 10m
          encrypt: "true"
          key-provider: ${{ steps.cfg.outputs.key-provider }}
          key-vault-key-id: ${{ vars.AYASEE_KEY_VAULT_KEY_ID }}
          kms-key-id: ${{ vars.AYASEE_KMS_KEY_ID }}
          gcp-kms-key-name: ${{ vars.AYASEE_GCP_KMS_KEY_NAME }}
          openbao-key-url: ${{ vars.AYASEE_OPENBAO_KEY_URL }}
      - id: units
        name: Locate the units record
        if: ${{ always() }}
        run: |
          f="$RUNNER_TEMP/ayasee/prod/units.json"
          if [ -f "$f" ]; then echo "units-json=$f" >>"$GITHUB_OUTPUT"; fi
      - uses: tttao/ayasee/actions/ledger@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        if: ${{ always() && steps.units.outputs.units-json != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AYASEE_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          GIT_CONFIG_COUNT: ${{ secrets.ledger-token && '1' || '0' }}
          GIT_CONFIG_KEY_0: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$AYASEE_LEDGER_TOKEN"; }; f'
          AWS_ACCESS_KEY_ID: ${{ secrets.AYASEE_LEDGER_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AYASEE_LEDGER_AWS_SECRET_ACCESS_KEY }}
        with:
          store: ${{ env.AYASEE_LEDGER_URL }}
          repo: ${{ github.repository }}
          env: prod
          sha: ${{ needs.validate.outputs.sha }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          units-json: ${{ steps.units.outputs.units-json }}
          approver: ${{ steps.approver.outputs.login }}
          breakglass-incident: ${{ needs.validate.outputs.incident }}
          mirror-deployments: "true"
          environment-prefix: ${{ needs.validate.outputs.environment-prefix }}
      - name: Open the stop-the-line issue
        if: ${{ failure() && steps.apply.outcome == 'failure' && steps.units.outputs.units-json != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: ayasee issue stop-the-line --repo "$REPO" --env prod --sha "$SHA" --run-url "$RUN_URL"
      - name: Open the post-approval issue
        # one issue per use, even when the apply failed (a half-applied prod needs the review most)
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INCIDENT: ${{ needs.validate.outputs.incident }}
          SHA: ${{ needs.validate.outputs.sha }}
          APPROVERS: ${{ steps.approver.outputs.login }}
          CHANGESET: ${{ steps.plan.outputs.changeset-path }}
          ROLLBACK_FROM: ${{ steps.live.outputs.rollback-from }}
        run: |
          args=(--repo "$REPO" --incident "$INCIDENT" --sha "$SHA" --run-url "$RUN_URL" --approvers "$APPROVERS")
          [ -z "$CHANGESET" ] || args+=(--changeset "$CHANGESET")
          [ -z "$ROLLBACK_FROM" ] || args+=(--rollback-from "$ROLLBACK_FROM")
          ayasee issue post-approval "${args[@]}"
      - uses: tttao/ayasee/actions/notify@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        with:
          event: breakglass_used
          repo: ${{ github.repository }}
          env: prod
          sha: ${{ needs.validate.outputs.sha }}
          run-url: ${{ env.RUN_URL }}
          approver: ${{ steps.approver.outputs.login }}
          teams-webhook: ${{ secrets.teams-webhook }}
      - uses: tttao/ayasee/actions/notify@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        if: ${{ failure() }}
        with:
          event: prod_failed
          repo: ${{ github.repository }}
          env: prod
          sha: ${{ needs.validate.outputs.sha }}
          run-url: ${{ env.RUN_URL }}
          teams-webhook: ${{ secrets.teams-webhook }}

  request:
    # gate_mechanism: workflow (D15): plan the whole prod tree with the plan identity and keep the
    # encrypted plan for a reviewer of reviewers.breakglass; nothing is applied here
    name: request
    needs: validate
    if: ${{ needs.validate.outputs.gate-mechanism == 'workflow' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment-prefix }}prod-plan
    permissions:
      id-token: write # OIDC login to Azure and Databricks
      contents: read # check out the code
    concurrency:
      group: ayasee-${{ github.repository }}-prod-plan
      cancel-in-progress: false
    outputs:
      manifest-digest: ${{ steps.summary.outputs.manifest-digest }}
      critical: ${{ steps.summary.outputs.critical }}
      high: ${{ steps.summary.outputs.high }}
      medium: ${{ steps.summary.outputs.medium }}
      total: ${{ steps.summary.outputs.total }}
      rollback-from: ${{ steps.live.outputs.rollback-from }}
    env:
      AYASEE_LEDGER_URL: ${{ vars.AYASEE_LEDGER_URL || needs.validate.outputs.ledger-url }}
    steps:
      - name: Require a ledger URL
        run: |
          [ -n "$AYASEE_LEDGER_URL" ] || {
            echo "::error::no ledger URL: set AYASEE_LEDGER_URL on the prod-plan environment or ledger.url in .ayasee.yaml"
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a commit that is not on main
        env:
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null || {
            echo "::error::origin/main was not fetched; cannot check that $SHA is on main"
            exit 1
          }
          rc=0
          git merge-base --is-ancestor "$SHA" origin/main || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error::$SHA is not an ancestor of origin/main; break-glass only deploys reviewed, merged commits"
               exit 1 ;;
            *) echo "::error::cannot check whether $SHA is on main (git exit $rc)"
               exit 1 ;;
          esac
      - uses: tttao/ayasee/actions/setup@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Refuse settings that are not supported yet (R35, R73)
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ! problems="$(ayasee config check-supported --path "$CONFIG_PATH" 2>&1)"; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
      - name: Label deviations from the compliant defaults
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          # gate_mechanism: workflow (D15) is itself a deviation; say so on every run
          labels="$(ayasee config labels --path "$CONFIG_PATH")"
          [ -n "$labels" ] || exit 0
          while IFS= read -r line; do
            echo "::warning::$line"
            echo "> **$line**" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$labels"
      - id: cfg
        name: Read the configuration
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          ayasee config show --path "$CONFIG_PATH" >"$RUNNER_TEMP/ayasee-config.json"
          cfg="$RUNNER_TEMP/ayasee-config.json"
          {
            echo "units-root=$(jq -er '.units_root' "$cfg")"
            echo "engine=$(jq -er '.engine' "$cfg")"
            echo "identity=$(jq -er '.identity' "$cfg")"
            echo "provider-env-names=$(jq -r '.provider_env | join(",")' "$cfg")"
            echo "key-provider=$(jq -er '.plan_encryption.key_provider' "$cfg")"
            echo "shared-units=$(jq -r '.shared_units | join(",")' "$cfg")"
            echo "allow-cascade=$(jq -r '.allow_cascade' "$cfg")"
          } >>"$GITHUB_OUTPUT"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: ${{ steps.cfg.outputs.identity == 'oidc' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: live
        name: Refuse a rollback unless allow-rollback is true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AYASEE_LEDGER_TOKEN: ${{ secrets.ledger-token }}
          GIT_CONFIG_COUNT: ${{ secrets.ledger-token && '1' || '0' }}
          GIT_CONFIG_KEY_0: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$AYASEE_LEDGER_TOKEN"; }; f'
          AWS_ACCESS_KEY_ID: ${{ secrets.AYASEE_LEDGER_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AYASEE_LEDGER_AWS_SECRET_ACCESS_KEY }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.validate.outputs.sha }}
          ALLOW_ROLLBACK: ${{ needs.validate.outputs.allow-rollback }}
        run: |
          # checked again against the ledger when the plan is approved (iac-approve)
          ayasee ledger show --store "$AYASEE_LEDGER_URL" --repo "$REPO" --env prod \
            >"$RUNNER_TEMP/ledger-prod.json"
          live="$(jq -r '.sha // ""' "$RUNNER_TEMP/ledger-prod.json")"
          if [ -z "$live" ]; then
            echo "::notice::no ledger record for prod; first deploy, no rollback check"
            echo "rollback-from=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$live" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::the ledger record of prod has no valid commit SHA"
            exit 1
          }
          git cat-file -e "$live^{commit}" 2>/dev/null || {
            echo "::error::the commit live in prod ($live) is not in this repository's history"
            exit 1
          }
          rc=0
          git merge-base --is-ancestor "$live" "$SHA" || rc=$?
          case "$rc" in
            0) echo "rollback-from=" >>"$GITHUB_OUTPUT" ;;
            1)
              [ "$ALLOW_ROLLBACK" = true ] || {
                echo "::error::$SHA is older than the commit live in prod (${live:0:12}); set allow-rollback to true to roll back"
                exit 1
              }
              echo "::warning::rollback from ${live:0:12} to ${SHA:0:12}: the target is older than the commit live in prod"
              echo "rollback-from=$live" >>"$GITHUB_OUTPUT" ;;
            *)
              echo "::error::cannot compare $SHA with the live commit (git exit $rc)"
              exit 1 ;;
          esac
      - id: plan
        uses: tttao/ayasee/actions/plan@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          env: prod
          units-root: ${{ steps.cfg.outputs.units-root }}
          engine: ${{ steps.cfg.outputs.engine }}
          encrypt: "true"
          binding-mode: encrypted_plan # D1: the approver applies exactly this plan
          shared-units: ${{ steps.cfg.outputs.shared-units }}
          allow-cascade: ${{ steps.cfg.outputs.allow-cascade }} # UNSAFE when true (R52)
          lock-timeout: 10m
          expect-sha: "true" # fail unless the checkout really is the sha to deploy
          key-provider: ${{ steps.cfg.outputs.key-provider }}
          key-vault-key-id: ${{ vars.AYASEE_KEY_VAULT_KEY_ID }}
          kms-key-id: ${{ vars.AYASEE_KMS_KEY_ID }}
          gcp-kms-key-name: ${{ vars.AYASEE_GCP_KMS_KEY_NAME }}
          openbao-key-url: ${{ vars.AYASEE_OPENBAO_KEY_URL }}
        env:
          AYASEE_EXTRA_SECRET: ${{ secrets.extra-env-secret }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AYASEE_PROVIDER_ENV: ${{ steps.cfg.outputs.identity == 'secrets' && secrets.AYASEE_PROVIDER_ENV || '' }}
          AYASEE_PROVIDER_ENV_NAMES: ${{ steps.cfg.outputs.provider-env-names }}
          AYASEE_PLAN_PASSPHRASE: ${{ secrets.AYASEE_PLAN_PASSPHRASE }} # pbkdf2 only
          AYASEE_KMS_ACCESS_KEY_ID: ${{ secrets.AYASEE_KMS_ACCESS_KEY_ID }} # aws_kms only
          AYASEE_KMS_SECRET_ACCESS_KEY: ${{ secrets.AYASEE_KMS_SECRET_ACCESS_KEY }} # aws_kms only
          AYASEE_GCP_KMS_CREDENTIALS: ${{ secrets.AYASEE_GCP_KMS_CREDENTIALS }} # gcp_kms only
          AYASEE_OPENBAO_TOKEN: ${{ secrets.AYASEE_OPENBAO_TOKEN }} # openbao only
          SG_SHA: ${{ needs.validate.outputs.sha }}
          # identity: oidc (default) is the Entra OIDC profile; identity: secrets sets none of these
          ARM_USE_OIDC: ${{ steps.cfg.outputs.identity == 'oidc' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_CLIENT_ID || '' }}
          ARM_TENANT_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_TENANT_ID || '' }}
          ARM_SUBSCRIPTION_ID: ${{ steps.cfg.outputs.identity == 'oidc' && vars.AZURE_SUBSCRIPTION_ID || '' }}
          DATABRICKS_AUTH_TYPE: ${{ steps.cfg.outputs.identity == 'oidc' && 'github-oidc-azure' || '' }}
      - uses: tttao/ayasee/actions/policy@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          plan-json: ${{ steps.plan.outputs.json-dir }}
          stage: prod
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: summary
        name: Summarise the plan and write the request
        env:
          CHANGESET: ${{ steps.plan.outputs.changeset-path }}
          MANIFEST: ${{ steps.plan.outputs.manifest-path }}
          INCIDENT: ${{ needs.validate.outputs.incident }}
          SHA: ${{ needs.validate.outputs.sha }}
          ALLOW_ROLLBACK: ${{ needs.validate.outputs.allow-rollback }}
        run: |
          # counts and the manifest's SHA-256 only (D15: an approval names this digest)
          critical="$(jq -e '.risk.critical' "$CHANGESET")"
          high="$(jq -e '.risk.high' "$CHANGESET")"
          medium="$(jq -e '.risk.medium' "$CHANGESET")"
          total="$(jq -e '.items | length' "$CHANGESET")"
          digest="$(sha256sum "$MANIFEST" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::cannot hash the manifest"; exit 1; }
          jq -n --arg incident "$INCIDENT" --arg sha "$SHA" --argjson rollback "$ALLOW_ROLLBACK" \
            --argjson critical "$critical" --argjson high "$high" --argjson medium "$medium" \
            --argjson total "$total" '{schema: "ayasee.breakglass-request/v1", incident: $incident,
              sha: $sha, allow_rollback: $rollback,
              counts: {critical: $critical, high: $high, medium: $medium, total: $total}}' \
            >"$(dirname "$MANIFEST")/request.json"
          {
            echo "critical=$critical"
            echo "high=$high"
            echo "medium=$medium"
            echo "total=$total"
            echo "manifest-digest=$digest"
            echo "request-path=$(dirname "$MANIFEST")/request.json"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayasee-breakglass-plan-${{ needs.validate.outputs.sha }}
          path: |
            ${{ steps.plan.outputs.plan-dir }}
            ${{ steps.plan.outputs.manifest-path }}
            ${{ steps.summary.outputs.request-path }}
          retention-days: 7
          if-no-files-found: error

  request-issue:
    # gate_mechanism: workflow (D15): the approval issue, with identifiers and counts only. No
    # environment and no secret.
    name: request-issue
    needs: [validate, request]
    if: ${{ needs.validate.outputs.gate-mechanism == 'workflow' && needs.request.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code (in-repo actions)
      issues: write # the break-glass approval issue
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: tttao/ayasee/actions/setup@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Open the break-glass approval issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INCIDENT: ${{ needs.validate.outputs.incident }}
          SHA: ${{ needs.validate.outputs.sha }}
          DIGEST: ${{ needs.request.outputs.manifest-digest }}
          REQUESTER: ${{ github.actor }}
          CRITICAL: ${{ needs.request.outputs.critical }}
          HIGH: ${{ needs.request.outputs.high }}
          MEDIUM: ${{ needs.request.outputs.medium }}
          TOTAL: ${{ needs.request.outputs.total }}
          ROLLBACK_FROM: ${{ needs.request.outputs.rollback-from }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ayasee approve breakglass-issue --repo "$REPO" --incident "$INCIDENT" --sha "$SHA" \
            --digest "$DIGEST" --run-url "$RUN_URL" --requester "$REQUESTER" \
            --critical "$CRITICAL" --high "$HIGH" --medium "$MEDIUM" --total "$TOTAL" \
            --rollback-from "$ROLLBACK_FROM"
          {
            echo "### Break-glass waits for approval (gate_mechanism: workflow)"
            echo
            echo "A reviewer listed in reviewers.breakglass, not the requester, starts **iac-approve** on main with:"
            echo
            echo "- incident: \`$INCIDENT\`"
            echo "- sha: \`$SHA\`"
            echo "- manifest-digest: \`$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: tttao/ayasee/actions/notify@38eefcd0cbe4056f8bcb03418b18d689b40a5302 # AYASEE_REF
        with:
          event: prod_waiting
          repo: ${{ github.repository }}
          env: prod
          sha: ${{ needs.validate.outputs.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          teams-webhook: ${{ secrets.teams-webhook }}
