# The pull-request plan of the shared prod units with gate_mechanism: workflow (D15, issue #40).
# See docs/concepts/pr-checks.md#shared-units.
#
# With the environment gate (the default), iac-pr plans the shared prod units of a pull request in
# the prod-pr-plan environment, and GitHub holds that job until a prod reviewer approves it. A
# private repository below GitHub Enterprise has no environment reviewers, and nothing else can
# hold a job of a pull-request run: the pull request controls its own run's workflow file. So the
# plan runs here instead, in a run that a prod reviewer starts ON MAIN, after reading the diff,
# with the pull request number and its head SHA:
#
#   verify   (no environment, no secret, github.token only) checks that the run is a
#            workflow_dispatch on refs/heads/main, started and not re-run by one person; that the
#            configuration of main (never of the pull request) has gate_mechanism: workflow and
#            shared_units, and lists that person in reviewers.prod; that they have write access;
#            that the pull request is open, from this repository (no fork), into main, and that
#            its head is exactly the SHA given; that the person did not open it nor write or
#            commit any of its commits (unless solo_mode); and that prod-pr-plan deploys from
#            main only. On a private repository on GitHub Free, which has no branch policies and
#            no environment secrets, it refuses: prod-pr-plan would accept every branch and hold
#            the repository's own credentials, the prod apply's.
#   plan     (environment prod-pr-plan: the read-only prod identity, main only) checks out exactly
#            that SHA, never the branch, and plans the shared units it changes against prod, as
#            plan-shared of iac-pr does (binding-mode replan, no encryption, no lock; never
#            applied). Like plan-shared it runs the pull request's code with that identity: the
#            reviewer's dispatch is what stands before it, as the reviewer's approval does there.
#   comment  (no pull-request code; base commit = main) posts the plan as the pull request's
#            "Shared prod units plan" sticky comment, naming the SHA planned and the approver, and
#            says so when the pull request has moved on: a new push needs a new authorisation.
#
# The comment shows what the plan action renders (risk tiers, addresses, principals), never a
# resource value, and is advisory: the pull request's code produced it. Nothing is applied, no
# ledger is read or written, no plan key is used. Like iac-approve, the plan job checks out the
# commit to plan, so the --local (./actions) form is not supported. Lines marked AYASEE_REF are
# placeholders rewritten at release.
#
# Environment names: prod-pr-plan is `environment_prefix` of .ayasee.yaml (of main) plus that
# name; docs/reference/ayasee-yaml.md#environment-names.
name: iac-pr-shared

on:
  workflow_call:
    inputs:
      pr:
        description: Number of the pull request to plan.
        type: string
        required: true
      sha:
        description: >-
          Full 40-character head SHA of the pull request, as read by the reviewer: only that
          commit is planned, and only while it is the head.
        type: string
        required: true
      tool-mirror:
        description: >-
          Optional https base URL (no trailing slash) replacing https://github.com for tool
          downloads (GitHub Enterprise Server or offline runners). SHA-256 checks still apply.
        type: string
        required: false
        default: ""
      config-path:
        description: Path of the ayasee configuration file.
        type: string
        required: false
        default: .ayasee.yaml
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: >-
          identity: secrets only. The read-only prod token, as an environment secret of
          prod-pr-plan (never the prod apply's token, never a repository secret): pull-request
          code runs with it. Only the plan step receives it.
        required: false
      AWS_ACCESS_KEY_ID:
        description: identity secrets only, read-only, as CLOUDFLARE_API_TOKEN. Only the plan step receives it.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: identity secrets only, read-only, as CLOUDFLARE_API_TOKEN. Only the plan step receives it.
        required: false
      AYASEE_PROVIDER_ENV:
        description: identity secrets only, as in iac-pr, an environment secret of prod-pr-plan. Only the plan step receives it.
        required: false

permissions: {}

jobs:
  verify:
    name: verify
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # the configuration of main
      pull-requests: read # the pull request, its head and its commits
      actions: read # the prod-pr-plan environment and its branch policy
    outputs:
      approver: ${{ steps.authorize.outputs.approver }}
      environment: ${{ steps.authorize.outputs.environment }}
    steps:
      # the configuration of main decides who may authorise, never that of the pull request
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Label deviations from the compliant defaults
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          labels="$(ayasee config labels --path "$CONFIG_PATH")"
          [ -n "$labels" ] || exit 0
          while IFS= read -r line; do
            echo "::warning::$line"
            echo "> **$line**" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$labels"
      - id: authorize
        name: Check the reviewer, the pull request and the environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          err="$RUNNER_TEMP/ayasee-pr-shared.err"
          rc=0
          ayasee pr-shared authorize --repo "$REPO" --pr "$PR_NUMBER" --sha "$SHA" --ref "$REF" \
            --event "$EVENT" --actor "$ACTOR" --triggering-actor "$TRIGGERING_ACTOR" \
            --config-path "$CONFIG_PATH" >"$RUNNER_TEMP/ayasee-pr-shared.out" 2>"$err" || rc=$?
          while IFS= read -r line; do
            case "$line" in
              pr-shared:*) echo "::error::${line#pr-shared: }" ;;
              warning:*) echo "::warning::${line#warning: }"; echo "> **${line#warning: }**" >>"$GITHUB_STEP_SUMMARY" ;;
              notice:*) echo "::notice::${line#notice: }" ;;
              *) echo "$line" ;;
            esac
          done <"$err"
          [ "$rc" -eq 0 ] || exit 1
          cat "$RUNNER_TEMP/ayasee-pr-shared.out" >>"$GITHUB_OUTPUT"
          {
            echo "### Pull-request plan of the shared prod units authorised"
            echo
            echo "- pull request: #$PR_NUMBER"
            echo "- sha: \`$SHA\`"
            echo "- approver: $ACTOR"
          } >>"$GITHUB_STEP_SUMMARY"

  plan:
    # plan the authorised SHA's changed shared units read-only against prod; never applied
    name: plan
    needs: verify
    # an empty environment name would run the job with no environment: never
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.verify.outputs.environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.verify.outputs.environment }}
    permissions:
      contents: read # check out the authorised commit
      id-token: write # OIDC login with the read-only prod identity
    concurrency:
      group: ayasee-${{ github.repository }}-pr-${{ inputs.pr }}-shared
      cancel-in-progress: false
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # re-running only this job reuses the outputs of verify: check again that the person who
      # starts this attempt is the reviewer that verify accepted
      - name: Refuse a re-run by another person
        env:
          APPROVER: ${{ needs.verify.outputs.approver }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          a="${APPROVER,,}"
          if [ -z "$a" ] || [ "${ACTOR,,}" != "$a" ] || [ "${TRIGGERING_ACTOR,,}" != "$a" ]; then
            echo "::error::this attempt was started by $TRIGGERING_ACTOR, not by the reviewer $APPROVER; start iac-pr-shared again"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0 # the diff against main needs the merge base
          persist-credentials: false
      - name: Refuse a checkout that is not the authorised commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::the checkout is not $SHA"; exit 1; }
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Refuse settings that are not supported yet (R35, R73)
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ! problems="$(ayasee config check-supported --path "$CONFIG_PATH" 2>&1)"; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
      - id: changed
        name: Find the changed shared prod units
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          SHA: ${{ inputs.sha }}
        run: |
          cfg="$RUNNER_TEMP/ayasee-config.json"
          ayasee config show --path "$CONFIG_PATH" >"$cfg"
          shared="$(jq -r '.shared_units | join(",")' "$cfg")"
          # the diff the reviewer read: the pull request against its merge base with main
          base="$(git merge-base "$SHA" origin/main)"
          units=""
          if [ -n "$shared" ]; then
            units="$(ayasee changed-units --base "$base" --head "$SHA" \
              --units-root "$(jq -r '.units_root' "$cfg")" --iac-root "$(jq -r '.iac_root' "$cfg")" \
              --config-path "$CONFIG_PATH" --env prod --shared "$shared")"
          fi
          {
            if [ -n "$units" ]; then echo "any=true"; else echo "any=false"; fi
            echo "units=$units"
            echo "shared-units=$shared"
            echo "units-root=$(jq -r '.units_root' "$cfg")"
            echo "engine=$(jq -r '.engine' "$cfg")"
            echo "identity=$(jq -er '.identity' "$cfg")"
            echo "provider-env-names=$(jq -r '.provider_env | join(",")' "$cfg")"
          } >>"$GITHUB_OUTPUT"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: ${{ steps.changed.outputs.any == 'true' && steps.changed.outputs.identity == 'oidc' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: plan
        if: ${{ steps.changed.outputs.any == 'true' }}
        uses: OWNER/ayasee/actions/plan@0000000000000000000000000000000000000000 # AYASEE_REF
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.changed.outputs.identity == 'secrets' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ steps.changed.outputs.identity == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.changed.outputs.identity == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AYASEE_PROVIDER_ENV: ${{ steps.changed.outputs.identity == 'secrets' && secrets.AYASEE_PROVIDER_ENV || '' }}
          AYASEE_PROVIDER_ENV_NAMES: ${{ steps.changed.outputs.provider-env-names }}
          # identity: oidc (default) is the Entra OIDC profile; identity: secrets sets none of these
          ARM_USE_OIDC: ${{ steps.changed.outputs.identity == 'oidc' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ steps.changed.outputs.identity == 'oidc' && vars.AZURE_CLIENT_ID || '' }}
          ARM_TENANT_ID: ${{ steps.changed.outputs.identity == 'oidc' && vars.AZURE_TENANT_ID || '' }}
          ARM_SUBSCRIPTION_ID: ${{ steps.changed.outputs.identity == 'oidc' && vars.AZURE_SUBSCRIPTION_ID || '' }}
          DATABRICKS_AUTH_TYPE: ${{ steps.changed.outputs.identity == 'oidc' && 'github-oidc-azure' || '' }}
        with:
          env: prod
          units-root: ${{ steps.changed.outputs.units-root }}
          engine: ${{ steps.changed.outputs.engine }}
          only-units: ${{ steps.changed.outputs.units }}
          shared-units: ${{ steps.changed.outputs.shared-units }}
          encrypt: "false"
          binding-mode: replan # never applied: the plan files are deleted after planning
          lock: "false" # a read-only identity cannot write the state lock
      - id: policy
        if: ${{ steps.plan.outcome == 'success' }}
        uses: OWNER/ayasee/actions/policy@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          plan-json: ${{ steps.plan.outputs.json-dir }}
          stage: prod
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: body
        name: Write the comment body
        if: ${{ !cancelled() }}
        env:
          CHANGED_OUTCOME: ${{ steps.changed.outcome }}
          ANY: ${{ steps.changed.outputs.any }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SUMMARY: ${{ steps.plan.outputs.summary-path }}
        run: |
          out="$RUNNER_TEMP/pr-comment-shared.md"
          {
            echo "### Shared prod units plan"
            echo
            if [ "$CHANGED_OUTCOME" != success ]; then
              printf 'The plan of the shared prod units failed before it started. See the [run](%s).\n' "$RUN_URL"
            elif [ "$ANY" != true ]; then
              echo "No shared prod unit changed at this commit; nothing was planned."
            elif [ "$PLAN_OUTCOME" != success ]; then
              printf 'The plan of the shared prod units failed. See the [run](%s).\n' "$RUN_URL"
            else
              echo "Planned against prod; applied only behind the prod gate after merge."
              echo
              cat "$SUMMARY"
              echo
              if [ "$POLICY_OUTCOME" = success ]; then
                echo "Policy pack: passed."
              else
                printf 'Policy pack: failed. See the [run](%s).\n' "$RUN_URL"
              fi
            fi
          } >"$out"
          echo "path=$out" >>"$GITHUB_OUTPUT"
      - name: Keep the comment body for the comment job
        if: ${{ !cancelled() && steps.body.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayasee-pr-comment-shared
          path: ${{ steps.body.outputs.path }}
          retention-days: 1
          if-no-files-found: error

  comment:
    # posts the sticky comment; no OIDC and no pull-request code: only main is checked out (R39)
    name: comment
    needs: [verify, plan]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out main
      pull-requests: write # the sticky comment
    steps:
      - name: Check out main (never the pull request)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # the plan job reports its own failure
        with:
          name: ayasee-pr-comment-shared
          path: ${{ runner.temp }}/pr-comment
      - name: Explain a missing artifact
        if: ${{ steps.download.outcome != 'success' }}
        run: echo "::warning::no comment body from the plan job; see that job"
      - name: Post the sticky comment
        if: ${{ steps.download.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          APPROVER: ${{ needs.verify.outputs.approver }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          ayasee pr-shared comment --repo "$REPO" --pr "$PR_NUMBER" --sha "$SHA"
          --approver "$APPROVER" --run-url "$RUN_URL"
          --body-file "$RUNNER_TEMP/pr-comment/pr-comment-shared.md"
