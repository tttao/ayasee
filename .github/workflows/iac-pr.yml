# Pull-request checks: static checks and scans, plus a plan of the first stage (dev by default) with a
# risk comment. It never applies.
# See docs/concepts/pr-checks.md.
#
# Token scopes (R39): a job that evaluates the PR's HCL (validate, plan) never holds
# `pull-requests: write` or `security-events: write`. Those jobs hand their result over as an
# artifact, and the small `comment` and `upload-sarif` jobs, which run no PR code, publish it.
#
# Trigger: this is a reusable workflow. The calling workflow must use `pull_request`, never
# `pull_request_target` (which would run with secrets and a write token against untrusted code).
# Pull requests from forks get no OIDC token: the plan (resolve, plan-first-stage, plan-dev) is
# skipped for them, and so is the SARIF upload (a fork's token cannot write security events). The
# checks still run.
#
# Required checks: `checks` and `plan-dev`. plan-dev is the verdict of the pull-request plan: it is
# red when resolve refuses the configuration (and plan-first-stage is skipped) or when the plan or
# the policy pack fails, so a configuration that does not load never reads as a passed check.
#
# Lines marked AYASEE_REF are placeholders (all-zero SHA, owner OWNER): scripts/set-ayasee-ref.sh
# rewrites them at release (or to ./actions for in-repo runs). This file is not callable before that.
name: iac-pr

on:
  workflow_call:
    inputs:
      tool-mirror:
        description: >-
          Optional https base URL (no trailing slash) replacing https://github.com for tool
          downloads (GitHub Enterprise Server or offline runners). SHA-256 checks still apply.
        type: string
        required: false
        default: ""
      config-path:
        description: Path of the ayasee configuration file.
        type: string
        required: false
        default: .ayasee.yaml
      checkov-version:
        description: Checkov version, run with uvx.
        type: string
        required: false
        default: 3.4.3
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: >-
          identity: secrets only. Pass it by name and create it as an environment secret of
          <first-stage>-plan (dev-plan with the default stages; read-only tokens: a pull
          request runs untrusted code), never at repository or organisation level; only the plan
          step receives it.
        required: false
      AWS_ACCESS_KEY_ID:
        description: >-
          identity: secrets only. Pass it by name and create it as an environment secret of
          <first-stage>-plan (dev-plan with the default stages; read-only tokens: a pull
          request runs untrusted code), never at repository or organisation level; only the plan
          step receives it.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: >-
          identity: secrets only. Pass it by name and create it as an environment secret of
          <first-stage>-plan (dev-plan with the default stages; read-only tokens: a pull
          request runs untrusted code), never at repository or organisation level; only the plan
          step receives it.
        required: false
      AYASEE_PROVIDER_ENV:
        description: >-
          identity: secrets only. More provider variables (OVH, Hetzner, Scaleway, a second
          Cloudflare account through TF_VAR_*) as one JSON object of name to string value, for
          example {"HCLOUD_TOKEN": "..."}. Every name must be declared in provider_env in
          .ayasee.yaml; reserved names (PATH, LD_*, GITHUB_*, TF_* except TF_VAR_*, AWS_*,
          CLOUDFLARE_*, ...) and values under 16 characters are refused. Pass it
          by name and create it as an environment secret of each stage environment, never at
          repository or organisation level; only the plan and apply steps receive it, and each
          value is masked.
        required: false

permissions: {}

jobs:
  checks:
    # static checks and scans; no cloud access, no plan
    name: checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    env:
      UV_NO_CACHE: "1" # R40: no uv cache anywhere
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: config
        name: Read the configuration
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          ayasee config show --path "$CONFIG_PATH" >"$RUNNER_TEMP/ayasee-config.json"
          {
            echo "units-root=$(jq -r '.units_root' "$RUNNER_TEMP/ayasee-config.json")"
            echo "iac-root=$(jq -r '.iac_root' "$RUNNER_TEMP/ayasee-config.json")"
          } >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/sarif"
      # Every check below is scoped to iac_root, so in a monorepo the application code beside the
      # estate (Dockerfiles, Compose files, its own workflows) is not judged by the IaC check.
      - name: Format check (OpenTofu)
        env:
          IAC_ROOT: ${{ steps.config.outputs.iac-root }}
        run: tofu fmt -check -recursive "$IAC_ROOT"
      - name: Format check (Terragrunt)
        env:
          IAC_ROOT: ${{ steps.config.outputs.iac-root }}
        run: terragrunt hcl format --check --working-dir "$IAC_ROOT"
      - name: Check that shared units exist in prod only
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ! problems="$(ayasee config check-shared --path "$CONFIG_PATH" 2>&1)"; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
      - name: Validate the Terragrunt configuration
        env:
          UNITS_ROOT: ${{ steps.config.outputs.units-root }}
        run: terragrunt hcl validate --working-dir "$UNITS_ROOT"
      - id: trivy
        name: Trivy config scan
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ steps.config.outputs.iac-root }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          exit-code: "1"
          format: sarif
          cache: "false"
          output: ${{ runner.temp }}/sarif/trivy.raw.sarif
      - name: Scrub the Trivy SARIF
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        env:
          SARIF_IN: ${{ runner.temp }}/sarif/trivy.raw.sarif
          SARIF_OUT: ${{ runner.temp }}/sarif/trivy.sarif
          IAC_ROOT: ${{ steps.config.outputs.iac-root }}
        run: ayasee sarif-scrub --in "$SARIF_IN" --out "$SARIF_OUT" --uri-prefix "$IAC_ROOT"
      - id: checkov
        name: Checkov
        if: ${{ !cancelled() }}
        env:
          CHECKOV_VERSION: ${{ inputs.checkov-version }}
          IAC_ROOT: ${{ steps.config.outputs.iac-root }}
        run: |
          args=()
          if [ -f .ayasee/checkov.baseline ]; then
            args+=(--baseline .ayasee/checkov.baseline)
          fi
          # the github_actions framework judges the repository's workflows: only when the
          # repository is the estate (iac_root "."), never an application's workflows
          frameworks=(terraform)
          if [ "$IAC_ROOT" = . ]; then frameworks+=(github_actions); fi
          uvx "checkov@$CHECKOV_VERSION" --directory "$IAC_ROOT" --framework "${frameworks[@]}" \
            --output sarif --output-file-path "$RUNNER_TEMP/sarif/checkov" --quiet "${args[@]}"
      - name: Scrub the Checkov SARIF
        if: ${{ !cancelled() && steps.checkov.outcome != 'skipped' }}
        env:
          SARIF_IN: ${{ runner.temp }}/sarif/checkov/results_sarif.sarif
          SARIF_OUT: ${{ runner.temp }}/sarif/checkov.sarif
          IAC_ROOT: ${{ steps.config.outputs.iac-root }}
        run: ayasee sarif-scrub --in "$SARIF_IN" --out "$SARIF_OUT" --uri-prefix "$IAC_ROOT"
      - name: Keep the scrubbed SARIF for the upload job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayasee-sarif
          path: |
            ${{ runner.temp }}/sarif/trivy.sarif
            ${{ runner.temp }}/sarif/checkov.sarif
          retention-days: 1
          if-no-files-found: warn
      - name: List findings (rule ids and files only)
        if: ${{ !cancelled() }}
        run: |
          for f in "$RUNNER_TEMP/sarif/trivy.sarif" "$RUNNER_TEMP/sarif/checkov.sarif"; do
            [ -f "$f" ] || continue
            jq -r '.runs[]?.results[]? | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri // "")"' "$f"
          done

  upload-sarif:
    # publishes the scrubbed SARIF; checks out and runs no PR code. Fork PRs have a read-only token.
    name: upload-sarif
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.checks.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF
      actions: read # upload-sarif on private repositories
      contents: read # upload-sarif on private repositories (no checkout happens)
    steps:
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # the checks job reports its own failure
        with:
          name: ayasee-sarif
          path: ${{ runner.temp }}/sarif
      - name: Explain a missing artifact
        if: ${{ steps.download.outcome != 'success' }}
        run: echo "::warning::no SARIF from checks; see that job"
      - id: found
        name: See which SARIF files arrived
        if: ${{ steps.download.outcome == 'success' }}
        run: |
          for tool in trivy checkov; do
            if [ -f "$RUNNER_TEMP/sarif/$tool.sarif" ]; then echo "$tool=true"; else echo "$tool=false"; fi
          done >>"$GITHUB_OUTPUT"
      - name: Upload the Trivy SARIF
        if: ${{ steps.found.outputs.trivy == 'true' }}
        uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy.sarif
          category: ayasee-trivy
      - name: Upload the Checkov SARIF
        if: ${{ !cancelled() && steps.found.outputs.checkov == 'true' }}
        uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/checkov.sarif
          category: ayasee-checkov

  resolve:
    # names the environment plan-first-stage runs in, <first-stage>-plan (issue #11): a job's
    # environment is fixed before its steps run, so it comes from this job. No identity, no
    # environment. It fails on a configuration that does not load or a refused stage name; then
    # plan-first-stage is skipped, plan-dev fails and comment says so.
    name: resolve
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    outputs:
      pr-plan-environment: ${{ steps.env.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: env
        name: Name the pull-request plan environment
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          # refuses a first stage that is prod, and any stage name with a fixed role (drift-*, *-plan)
          if ! name="$(ayasee config pr-plan-environment --path "$CONFIG_PATH" 2>"$RUNNER_TEMP/err")"; then
            while IFS= read -r line; do echo "::error::$line"; done <"$RUNNER_TEMP/err"
            exit 1
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"

  plan-first-stage:
    # plan the changed units of the first stage with a read-only identity, run the pack, write the
    # risk summary for the comment job. Its verdict is plan-dev.
    name: plan-first-stage
    needs: resolve
    # Fork pull requests get no OIDC token; the event check keeps a pull_request_target caller out.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.resolve.outputs.pr-plan-environment != '' }}
    runs-on: ubuntu-latest
    # <first-stage>-plan: dev-plan with the default stages, test-plan with [test, prod]
    environment: ${{ needs.resolve.outputs.pr-plan-environment }}
    permissions:
      contents: read # check out the code
      id-token: write # OIDC login to Azure and Databricks (read-only identity)
    concurrency:
      group: ayasee-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the diff against the base needs the merge base
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Refuse settings that are not supported yet (R35, R73)
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ! problems="$(ayasee config check-supported --path "$CONFIG_PATH" 2>&1)"; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
      - name: Label deviations from the compliant defaults
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          # identity: secrets (D7) and solo_mode (D2) are opt-ins that weaken a default; say so
          labels="$(ayasee config labels --path "$CONFIG_PATH")"
          [ -n "$labels" ] || exit 0
          while IFS= read -r line; do
            echo "::warning::$line"
            echo "> **$line**" >>"$GITHUB_STEP_SUMMARY"
          done <<<"$labels"
      - id: changed
        name: Find the changed units of the first stage
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ayasee config show --path "$CONFIG_PATH" >"$RUNNER_TEMP/ayasee-config.json"
          units_root="$(jq -r '.units_root' "$RUNNER_TEMP/ayasee-config.json")"
          # the first configured stage (dev by default) is the one a pull request plans
          stage="$(jq -er '.stages[0]' "$RUNNER_TEMP/ayasee-config.json")"
          identity="$(jq -er '.identity' "$RUNNER_TEMP/ayasee-config.json")"
          iac_root="$(jq -r '.iac_root' "$RUNNER_TEMP/ayasee-config.json")"
          # a change outside iac_root (application code in a monorepo) plans nothing
          units="$(ayasee changed-units --base "$BASE_SHA" --head "$HEAD_SHA" --units-root "$units_root" \
            --iac-root "$iac_root" --config-path "$CONFIG_PATH" --env "$stage")"
          {
            echo "units-root=$units_root"
            echo "stage=$stage"
            echo "identity=$identity"
            echo "provider-env-names=$(jq -r '.provider_env | join(",")' "$RUNNER_TEMP/ayasee-config.json")"
            echo "engine=$(jq -r '.engine' "$RUNNER_TEMP/ayasee-config.json")"
            if [ -z "$units" ]; then
              echo "any=false"
            else
              echo "any=true"
              # ALL (a change outside the stage's units) plans every unit of the stage
              if [ "$units" = ALL ]; then echo "only-units="; else echo "only-units=$units"; fi
            fi
          } >>"$GITHUB_OUTPUT"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: ${{ steps.changed.outputs.any == 'true' && steps.changed.outputs.identity == 'oidc' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: plan
        if: ${{ steps.changed.outputs.any == 'true' }}
        uses: OWNER/ayasee/actions/plan@0000000000000000000000000000000000000000 # AYASEE_REF
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.changed.outputs.identity == 'secrets' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ steps.changed.outputs.identity == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.changed.outputs.identity == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AYASEE_PROVIDER_ENV: ${{ steps.changed.outputs.identity == 'secrets' && secrets.AYASEE_PROVIDER_ENV || '' }}
          AYASEE_PROVIDER_ENV_NAMES: ${{ steps.changed.outputs.provider-env-names }}
          # identity: oidc (default) is the Entra OIDC profile; identity: secrets sets none of these
          ARM_USE_OIDC: ${{ steps.changed.outputs.identity == 'oidc' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ steps.changed.outputs.identity == 'oidc' && vars.AZURE_CLIENT_ID || '' }}
          ARM_TENANT_ID: ${{ steps.changed.outputs.identity == 'oidc' && vars.AZURE_TENANT_ID || '' }}
          ARM_SUBSCRIPTION_ID: ${{ steps.changed.outputs.identity == 'oidc' && vars.AZURE_SUBSCRIPTION_ID || '' }}
          DATABRICKS_AUTH_TYPE: ${{ steps.changed.outputs.identity == 'oidc' && 'github-oidc-azure' || '' }}
        with:
          env: ${{ steps.changed.outputs.stage }}
          units-root: ${{ steps.changed.outputs.units-root }}
          engine: ${{ steps.changed.outputs.engine }}
          only-units: ${{ steps.changed.outputs.only-units }}
          encrypt: "false"
          binding-mode: same-job
          lock: "false" # a read-only identity cannot write the state lock
      - id: policy
        if: ${{ steps.plan.outcome == 'success' }}
        uses: OWNER/ayasee/actions/policy@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          plan-json: ${{ steps.plan.outputs.json-dir }}
          stage: ${{ steps.changed.outputs.stage }}
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: body
        name: Write the comment body
        if: ${{ !cancelled() }}
        env:
          CHANGED_OUTCOME: ${{ steps.changed.outcome }}
          STAGE: ${{ steps.changed.outputs.stage }}
          ANY: ${{ steps.changed.outputs.any }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SUMMARY: ${{ steps.plan.outputs.summary-path }}
        run: |
          out="$RUNNER_TEMP/pr-comment.md"
          if [ "$CHANGED_OUTCOME" != success ]; then
            printf 'The pull-request plan failed before it started. See the [run](%s).\n' "$RUN_URL" >"$out"
          elif [ "$ANY" != true ]; then
            echo "No IaC changes in this pull request; nothing was planned." >"$out"
          elif [ "$PLAN_OUTCOME" != success ]; then
            printf 'The plan of %s failed. See the [run](%s).\n' "$STAGE" "$RUN_URL" >"$out"
          else
            {
              echo "### Plan of $STAGE"
              echo
              cat "$SUMMARY"
              echo
              if [ "$POLICY_OUTCOME" = success ]; then
                echo "Policy pack: passed."
              else
                printf 'Policy pack: failed. See the [run](%s).\n' "$RUN_URL"
              fi
            } >"$out"
          fi
          echo "path=$out" >>"$GITHUB_OUTPUT"
      - name: Keep the comment body for the comment job
        if: ${{ !cancelled() && steps.body.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayasee-pr-comment
          path: ${{ steps.body.outputs.path }}
          retention-days: 1
          if-no-files-found: error

  shared-changes:
    # which shared prod units (shared_units, #5) the PR changes; no identity, no environment, so a
    # PR that touches none of them never waits for the prod-pr-plan approval
    name: shared-changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    outputs:
      units: ${{ steps.shared.outputs.units }}
      shared-units: ${{ steps.shared.outputs.shared-units }}
      units-root: ${{ steps.shared.outputs.units-root }}
      engine: ${{ steps.shared.outputs.engine }}
      identity: ${{ steps.shared.outputs.identity }}
      provider-env-names: ${{ steps.shared.outputs.provider-env-names }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the diff against the base needs the merge base
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: shared
        name: Find the changed shared prod units
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cfg="$RUNNER_TEMP/ayasee-config.json"
          ayasee config show --path "$CONFIG_PATH" >"$cfg"
          shared="$(jq -r '.shared_units | join(",")' "$cfg")"
          units=""
          if [ -n "$shared" ]; then
            units="$(ayasee changed-units --base "$BASE_SHA" --head "$HEAD_SHA" \
              --units-root "$(jq -r '.units_root' "$cfg")" --iac-root "$(jq -r '.iac_root' "$cfg")" \
              --config-path "$CONFIG_PATH" --env prod --shared "$shared")"
          fi
          {
            echo "units=$units"
            echo "shared-units=$shared"
            echo "units-root=$(jq -r '.units_root' "$cfg")"
            echo "engine=$(jq -r '.engine' "$cfg")"
            echo "identity=$(jq -er '.identity' "$cfg")"
            echo "provider-env-names=$(jq -r '.provider_env | join(",")' "$cfg")"
          } >>"$GITHUB_OUTPUT"

  plan-shared:
    # plan the changed shared prod units read-only, so the PR shows a change that has no earlier
    # stage to soak in. Environment prod-pr-plan: a read-only prod identity, and the prod reviewers
    # approve before PR code runs with it (docs/concepts/pr-checks.md#shared-units).
    name: plan-shared
    needs: shared-changes
    if: ${{ needs.shared-changes.outputs.units != '' }}
    runs-on: ubuntu-latest
    environment: prod-pr-plan
    permissions:
      contents: read # check out the code
      id-token: write # OIDC login with the read-only prod identity
    concurrency:
      group: ayasee-${{ github.repository }}-pr-${{ github.event.pull_request.number }}-shared
      cancel-in-progress: false
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - name: Refuse settings that are not supported yet (R35, R73)
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          if ! problems="$(ayasee config check-supported --path "$CONFIG_PATH" 2>&1)"; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: ${{ needs.shared-changes.outputs.identity == 'oidc' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: plan
        uses: OWNER/ayasee/actions/plan@0000000000000000000000000000000000000000 # AYASEE_REF
        env:
          CLOUDFLARE_API_TOKEN: ${{ needs.shared-changes.outputs.identity == 'secrets' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ needs.shared-changes.outputs.identity == 'secrets' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ needs.shared-changes.outputs.identity == 'secrets' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AYASEE_PROVIDER_ENV: ${{ needs.shared-changes.outputs.identity == 'secrets' && secrets.AYASEE_PROVIDER_ENV || '' }}
          AYASEE_PROVIDER_ENV_NAMES: ${{ needs.shared-changes.outputs.provider-env-names }}
          # identity: oidc (default) is the Entra OIDC profile; identity: secrets sets none of these
          ARM_USE_OIDC: ${{ needs.shared-changes.outputs.identity == 'oidc' && 'true' || '' }}
          ARM_CLIENT_ID: ${{ needs.shared-changes.outputs.identity == 'oidc' && vars.AZURE_CLIENT_ID || '' }}
          ARM_TENANT_ID: ${{ needs.shared-changes.outputs.identity == 'oidc' && vars.AZURE_TENANT_ID || '' }}
          ARM_SUBSCRIPTION_ID: ${{ needs.shared-changes.outputs.identity == 'oidc' && vars.AZURE_SUBSCRIPTION_ID || '' }}
          DATABRICKS_AUTH_TYPE: ${{ needs.shared-changes.outputs.identity == 'oidc' && 'github-oidc-azure' || '' }}
        with:
          env: prod
          units-root: ${{ needs.shared-changes.outputs.units-root }}
          engine: ${{ needs.shared-changes.outputs.engine }}
          only-units: ${{ needs.shared-changes.outputs.units }}
          shared-units: ${{ needs.shared-changes.outputs.shared-units }}
          encrypt: "false"
          binding-mode: replan # never applied: the plan files are deleted after planning
          lock: "false" # a read-only identity cannot write the state lock
      - id: policy
        if: ${{ steps.plan.outcome == 'success' }}
        uses: OWNER/ayasee/actions/policy@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          plan-json: ${{ steps.plan.outputs.json-dir }}
          stage: prod
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: body
        name: Write the comment body
        if: ${{ !cancelled() }}
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          SUMMARY: ${{ steps.plan.outputs.summary-path }}
        run: |
          out="$RUNNER_TEMP/pr-comment-shared.md"
          if [ "$PLAN_OUTCOME" != success ]; then
            printf 'The plan of the shared prod units failed. See the [run](%s).\n' "$RUN_URL" >"$out"
          else
            {
              echo "### Shared prod units plan"
              echo
              echo "Planned against prod; applied only behind the prod gate after merge."
              echo
              cat "$SUMMARY"
              echo
              if [ "$POLICY_OUTCOME" = success ]; then
                echo "Policy pack: passed."
              else
                printf 'Policy pack: failed. See the [run](%s).\n' "$RUN_URL"
              fi
            } >"$out"
          fi
          echo "path=$out" >>"$GITHUB_OUTPUT"
      - name: Keep the comment body for the comment job
        if: ${{ !cancelled() && steps.body.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayasee-pr-comment-shared
          path: ${{ steps.body.outputs.path }}
          retention-days: 1
          if-no-files-found: error

  plan-dev:
    # the verdict of the pull-request plan, and the check to require: a skipped job reads as passed
    # in branch protection, so this job runs whenever resolve ran, even in a cancelled run (always()),
    # and fails unless resolve accepted the configuration and plan-first-stage passed. No checkout,
    # no identity, no environment.
    name: plan-dev
    needs: [resolve, plan-first-stage]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless the configuration was accepted and the plan passed
        env:
          RESOLVE: ${{ needs.resolve.result }}
          PLAN: ${{ needs.plan-first-stage.result }}
        run: |
          if [ "$RESOLVE" != success ]; then
            echo "::error::the pull-request plan did not start: resolve $RESOLVE (the configuration was refused; see that job)"
            exit 1
          fi
          if [ "$PLAN" != success ]; then
            echo "::error::the pull-request plan did not pass: plan-first-stage $PLAN (see that job)"
            exit 1
          fi

  comment:
    # posts the sticky comment; no OIDC and no PR code: only the BASE commit is checked out (R39),
    # which also gives the in-repo (--local, ./actions) form its actions
    name: comment
    needs: [resolve, plan-first-stage]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.resolve.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the base commit
      pull-requests: write # the sticky comment
    steps:
      - name: Check out the base commit (never the PR head)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # plan-first-stage reports its own failure
        with:
          name: ayasee-pr-comment
          path: ${{ runner.temp }}/pr-comment
      - id: refused
        name: Write the comment body when the configuration was refused
        if: ${{ needs.resolve.result == 'failure' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-comment"
          printf 'The pull-request plan failed before it started: the configuration was refused. See the [run](%s).\n' \
            "$RUN_URL" >"$RUNNER_TEMP/pr-comment/pr-comment.md"
      - name: Explain a missing artifact
        if: ${{ steps.download.outcome != 'success' && steps.refused.outcome != 'success' }}
        run: echo "::warning::no comment body from plan-first-stage; see that job"
      - name: Post the sticky comment
        if: ${{ steps.download.outcome == 'success' || steps.refused.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ayasee pr-comment --repo "$REPO" --pr "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-comment/pr-comment.md"

  comment-shared:
    # posts the shared-units plan as its own sticky comment, so the first stage's comment never waits
    # for the prod-pr-plan approval; same rules as comment: base commit only, no OIDC (R39)
    name: comment-shared
    needs: plan-shared
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan-shared.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the base commit
      pull-requests: write # the sticky comment
    steps:
      - name: Check out the base commit (never the PR head)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: OWNER/ayasee/actions/setup@0000000000000000000000000000000000000000 # AYASEE_REF
        with:
          tool-mirror: ${{ inputs.tool-mirror }}
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # plan-shared reports its own failure
        with:
          name: ayasee-pr-comment-shared
          path: ${{ runner.temp }}/pr-comment
      - name: Explain a missing artifact
        if: ${{ steps.download.outcome != 'success' }}
        run: echo "::warning::no comment body from plan-shared; see that job"
      - name: Post the sticky comment
        if: ${{ steps.download.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          ayasee pr-comment --repo "$REPO" --pr "$PR_NUMBER" --marker pr-plan-shared
          --body-file "$RUNNER_TEMP/pr-comment/pr-comment-shared.md"
