name: release

# Tag push v* builds, pins, attests and publishes a release (R68). workflow_dispatch is dry-run
# only (R69): it runs the read-only part and the local commit of the pin job, and skips every
# step that writes (branch push, attestation, GitHub release, PyPI upload); a dispatch with
# dry-run=false fails in the first job. Every write step also requires a tag ref.
# The first job refuses to run unless the licence in docs/governance/PROVENANCE.md, pyproject.toml
# and LICENSE agree and NOTICE is present (D14). See docs/guides/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pin only; skip the push, the attestation, the release and PyPI.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_CACHE: "1"

jobs:
  provenance:
    name: provenance gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only a dry run may be dispatched by hand
        env:
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ] && [ "$DRY_RUN" != true ]; then
            echo "::error::a real release is made by pushing a v* tag; run workflow_dispatch with dry-run=true"
            exit 1
          fi
      - name: Released commit must be on main
        run: |
          set -euo pipefail
          # the fetch-depth 0 checkout already holds origin/main; no second, credential-less fetch
          git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null ||
            { echo "::error::origin/main is not in the checkout"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::the commit is not an ancestor of origin/main"; exit 1; }
      - run: scripts/check-provenance.sh

  build:
    name: build
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Tag version must match ayasee.__version__
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ayasee/__init__.py)"
          [ -n "$version" ] || { echo "::error::cannot read ayasee.__version__"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$version" ] ||
              { echo "::error::tag $REF_NAME does not match ayasee.__version__ ($version)"; exit 1; }
          fi
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
      - name: Build the wheel and the sdist
        run: |
          set -euo pipefail
          uv build --out-dir dist
          unzip -l dist/*.whl | grep -q 'ayasee/rules/databricks-azure.yaml' ||
            { echo "::error::the wheel does not contain the packaged risk rules"; exit 1; }
      - name: Build the cockpit site
        working-directory: cockpit-site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Pack the cockpit site
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p site
          tar -czf "site/ayasee-cockpit-site-${TAG#v}.tar.gz" -C cockpit-site/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-site
          path: site/
          if-no-files-found: error

  pin:
    name: pin release branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.pin.outputs.source-sha }}
      release-sha: ${{ steps.pin.outputs.release-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rewrite the own-action references on release/<tag>
        id: pin
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/$TAG"
          files="$(grep -lE '#[ ]AYASEE_(REF|REPO|SHA)' .github/workflows/*.yml)"
          for f in $files; do
            scripts/set-ayasee-ref.sh "$REPO" "$src" "$f"
          done
          # shellcheck disable=SC2086  # $files is a newline-free list of workflow paths
          if grep -nE 'OWNER/ayasee|0{40} # AYASEE_(REF|SHA)' $files; then
            echo "::error::a AYASEE_REF placeholder is left behind"
            exit 1
          fi
          git commit -a -m "chore: pin ayasee actions to $src for $TAG"
          {
            echo "source-sha=$src"
            echo "release-sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
      - name: Push release/<tag>
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false) }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "release/$TAG"

  attest:
    name: attest
    needs: [build, pin]
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cockpit-site
          path: site
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            site/*.tar.gz

  github-release:
    name: github release
    needs: [build, pin, attest]
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cockpit-site
          path: site
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.pin.outputs.source-sha }}
          RELEASE_SHA: ${{ needs.pin.outputs.release-sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%-*}"   # a release candidate uses the section of its final version
          changelog="$(awk -v v="$base" '
            /^## \[/ { insec = (index($0, "## [" v "]") == 1); next }
            insec { print }
          ' CHANGELOG.md)"
          [ -n "$changelog" ] || { echo "::error::CHANGELOG.md has no section for $base"; exit 1; }
          {
            echo "## Pin"
            echo
            echo "- Release commit (callers pin this): \`$RELEASE_SHA\` on branch \`release/$TAG\`"
            echo "- Source commit (the tag, the code that is released): \`$SOURCE_SHA\`"
            echo
            echo "Reference the reusable workflows by the release commit, never by tag or branch:"
            echo
            echo "    uses: $REPO/.github/workflows/iac-staged.yml@$RELEASE_SHA # ayasee $TAG"
            echo
            echo "Verify an artifact: \`gh attestation verify <file> --repo $REPO\`."
            echo "See docs/guides/releasing.md and docs/guides/quickstart.md."
            echo
            echo "## Changes"
            echo
            printf '%s\n' "$changelog"
          } >release-notes.md
          flags=(--verify-tag)
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* site/* \
            --repo "$REPO" --title "ayasee $TAG" --notes-file release-notes.md "${flags[@]}"

  pypi:
    name: pypi
    needs: [build, pin, attest, github-release]
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ayasee
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
