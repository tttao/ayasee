# Pre-commit hooks: `uv run pre-commit install` once, then they run on every commit.
# `uv run pre-commit run --all-files` runs them over the repository. prek reads this file too.
# See CONTRIBUTING.md "Pre-commit hooks".
#
# Remote hook repositories are pinned by commit SHA with the tag in a `# frozen:` comment
# (`pre-commit autoupdate --freeze`), like the SHA-pinned actions; Renovate keeps them current.
# Local hooks run the checksum-verified tools of scripts/install-dev-tools.sh through
# scripts/dev-tool.sh, which fails with the install command when a tool is missing.
# No test runs on commit. The unit tests are an opt-in pre-push hook; integration tests stay in CI.

minimum_pre_commit_version: "4.4.0" # language: unsupported
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]
# Vendored files stay byte-identical to upstream: their SHA-256 is recorded in
# docs/governance/PROVENANCE.md. (The gitleaks hook scans staged changes, so it still covers them.)
exclude: ^website/javascripts/vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: ^website/mkdocs\.yml$
      - id: check-yaml
        name: check yaml (mkdocs python tags, syntax only)
        args: [--unsafe]
        files: ^website/mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: scripts/check-secrets.sh --staged
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: gitleaks-history
        name: gitleaks (whole history)
        entry: scripts/check-secrets.sh
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check, --diff]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning] # info and style notes (SC2015, SC1091) do not fail a commit

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--offline]
        # The scope of the CI job (`zizmor .github/ actions/`) plus this file. The workflows under
        # examples/ and e2e/fixture/ are adopter templates, not run here.
        files: ^(\.github/workflows/[^/]+\.ya?ml|actions/[^/]+/action\.ya?ml|\.pre-commit-config\.yaml)$

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: scripts/dev-tool.sh actionlint
        language: unsupported
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: tofu-fmt
        name: tofu fmt
        entry: scripts/dev-tool.sh tofu fmt -check -diff
        language: unsupported
        files: \.(tf|tofu|tfvars|tftest\.hcl)$
      - id: opa-fmt
        name: opa fmt
        entry: scripts/dev-tool.sh opa fmt --list --fail
        language: unsupported
        files: ^policy/.*\.rego$
      - id: opa-check
        name: opa check
        entry: scripts/dev-tool.sh opa check --strict policy/
        language: unsupported
        files: ^policy/.*\.rego$
        pass_filenames: false
      - id: check-links
        name: doc links
        entry: python3 scripts/check-links.py
        language: unsupported
        files: (\.md|^website/mkdocs\.yml)$
        pass_filenames: false
      # Opt-in (about 20 s): `uv run pre-commit install --hook-type pre-push`.
      - id: pytest-unit
        name: pytest (unit, before push)
        entry: uv run pytest -m "not integration" -q
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
