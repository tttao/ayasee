# Emergency prod deployment of a given SHA behind its own reviewers (R44).
name: breakglass

on:
  workflow_dispatch:
    inputs:
      incident:
        description: Incident reference, like ABC-123 or INC123.
        required: true
      sha:
        description: Full 40-character commit SHA to deploy; it must be an ancestor of origin/main.
        required: true
      allow-rollback:
        description: "true allows a sha older than the commit live in prod."
        required: false
        default: "false"

permissions: {}

jobs:
  breakglass:
    permissions:
      contents: read
      id-token: write
      deployments: write
      issues: write
      actions: read
    uses: OWNER/ayasee/.github/workflows/iac-breakglass.yml@0000000000000000000000000000000000000000 # replace with an ayasee release SHA
    with:
      incident: ${{ inputs.incident }}
      sha: ${{ inputs.sha }}
      allow-rollback: ${{ inputs.allow-rollback }}
    secrets:
      teams-webhook: ${{ secrets.TEAMS_WEBHOOK }}
      ledger-token: ${{ secrets.AYASEE_LEDGER_TOKEN }}
      AYASEE_PLAN_PASSPHRASE: ${{ secrets.AYASEE_PLAN_PASSPHRASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
