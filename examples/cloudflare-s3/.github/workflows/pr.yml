# Pull-request checks: scans, the test plan, and a read-only prod plan of changed shared units.
name: pr

on:
  pull_request:

permissions: {}

jobs:
  pr:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      actions: read
    uses: OWNER/ayasee/.github/workflows/iac-pr.yml@0000000000000000000000000000000000000000 # replace with an ayasee release SHA
    # identity: secrets: environment secrets of test-plan and prod-pr-plan, passed by name
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
