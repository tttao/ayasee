# Staged promotion on every merge to main: dev, uat, then a gated prod apply of the approved plan.
name: main

on:
  push:
    branches: [main]

permissions: {}

jobs:
  staged:
    permissions:
      contents: read
      id-token: write
      deployments: write
      issues: write
      actions: read
    uses: OWNER/ayasee/.github/workflows/iac-staged.yml@0000000000000000000000000000000000000000 # replace with an ayasee release SHA
    secrets:
      teams-webhook: ${{ secrets.TEAMS_WEBHOOK }}
