schema: spec-driven

context: |
  ayasee: a GitHub Actions-only CI/CD framework for staged, gated IaC promotion
  (OpenTofu + Terragrunt first). Pre-alpha; latest release candidate v0.1.0-rc.5.
  Stack: Python CLI `ayasee` (src/ayasee, uv, pytest, ruff), reusable workflows
  (.github/workflows/iac-*.yml), composite actions (actions/*, bash), Rego packs
  (policy/, conftest/opa), OpenTofu bootstrap modules (modules/), cockpit site
  (cockpit-site/, Vite + TypeScript, no framework).
  Ground rules: everything fails closed; no plan values leave a job (counts,
  addresses and links only); PR code is untrusted (R39); design decisions D1-D15
  live in docs/governance/decisions.md and narrower rulings are cited as R<n>.
  Docs live in docs/ (link-checked by scripts/check-links.py). Commits follow
  Conventional Commits: `type(scope): subject`.

