[project]
name = "ayasee"
dynamic = ["version"]
description = "GitHub Actions-only CI/CD framework for staged, gated infrastructure-as-code promotion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
ayasee = "ayasee.cli:entrypoint"

[project.optional-dependencies]
azure = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pre-commit>=4.4.0",
    "pytest>=8",
    "respx>=0.23.1",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ayasee/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ayasee"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "ayasee/rules"
# ayasee init: the profile templates of the released version
# file by file, so that nothing untracked (.terraform/) is packaged; tests/test_scaffold.py
# keeps this list equal to the files the profiles read
"examples/cloudflare-s3/.ayasee.yaml" = "ayasee/templates/cloudflare-s3/.ayasee.yaml"
"examples/cloudflare-s3/root.hcl" = "ayasee/templates/cloudflare-s3/root.hcl"
"examples/cloudflare-s3/.github/workflows/pr.yml" = "ayasee/templates/cloudflare-s3/.github/workflows/pr.yml"
"examples/cloudflare-s3/.github/workflows/main.yml" = "ayasee/templates/cloudflare-s3/.github/workflows/main.yml"
"examples/cloudflare-s3/.github/workflows/nightly.yml" = "ayasee/templates/cloudflare-s3/.github/workflows/nightly.yml"
"examples/cloudflare-s3/.github/workflows/breakglass.yml" = "ayasee/templates/cloudflare-s3/.github/workflows/breakglass.yml"
"examples/cloudflare-s3/bootstrap/main.tf" = "ayasee/templates/cloudflare-s3/bootstrap/main.tf"
"examples/cloudflare-s3/bootstrap/.terraform.lock.hcl" = "ayasee/templates/cloudflare-s3/bootstrap/.terraform.lock.hcl"
"examples/databricks-azure/.ayasee.yaml" = "ayasee/templates/databricks-azure/.ayasee.yaml"
"examples/databricks-azure/root.hcl" = "ayasee/templates/databricks-azure/root.hcl"
"examples/databricks-azure/.github/workflows/pr.yml" = "ayasee/templates/databricks-azure/.github/workflows/pr.yml"
"examples/databricks-azure/.github/workflows/main.yml" = "ayasee/templates/databricks-azure/.github/workflows/main.yml"
"examples/databricks-azure/.github/workflows/nightly.yml" = "ayasee/templates/databricks-azure/.github/workflows/nightly.yml"
"examples/databricks-azure/.github/workflows/breakglass.yml" = "ayasee/templates/databricks-azure/.github/workflows/breakglass.yml"
"examples/databricks-azure/bootstrap/main.tf" = "ayasee/templates/databricks-azure/bootstrap/main.tf"
"examples/databricks-azure/bootstrap/variables.tf" = "ayasee/templates/databricks-azure/bootstrap/variables.tf"
"examples/databricks-azure/bootstrap/outputs.tf" = "ayasee/templates/databricks-azure/bootstrap/outputs.tf"
"examples/databricks-azure/bootstrap/.terraform.lock.hcl" = "ayasee/templates/databricks-azure/bootstrap/.terraform.lock.hcl"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: needs tofu and terragrunt on the machine (run with -m integration)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
