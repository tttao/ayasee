# Documentation site (GitHub Pages). The source tree in .src/ is assembled from the repository's
# Markdown by scripts/build-docs-site.py; nothing is written by hand there.
site_name: ayasee
site_description: >-
  Staged, gated infrastructure-as-code promotion on GitHub Actions only: plan binding,
  a risk-tiered prod gate, a deployment ledger and a static estate cockpit.
site_url: https://tttao.github.io/ayasee/
repo_url: https://github.com/tttao/ayasee
repo_name: tttao/ayasee
edit_uri: ""
copyright: Copyright 2026 The ayasee Authors. Apache License 2.0.

docs_dir: .src
site_dir: ../build/site
strict: true

theme:
  name: material
  # partials/source.html: the repository link without the api.github.com fetch;
  # main.html: the vendored Mermaid, on pages with a diagram only
  custom_dir: overrides
  font: false
  icon:
    logo: material/boom-gate-up
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tables.js

extra:
  generator: false

plugins:
  - search

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # the same anchors as GitHub, so one set of links works in both places
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - Quickstart: docs/guides/quickstart.md
      - Adopt in an existing repository: docs/guides/adopt.md
      - Reference example (Databricks on Azure):
          - examples/databricks-azure/README.md
          - Ownership contract: examples/databricks-azure/OWNERSHIP.md
      - Reference example (Cloudflare and S3): examples/cloudflare-s3/README.md
      - Migrate from environment branches: docs/guides/migrate-from-env-branches.md
      - Onboard a brownfield estate: docs/guides/onboard-brownfield.md
  - Concepts:
      - Architecture: docs/concepts/architecture.md
      - Comparison with other tools: docs/comparison.md
      - The staged run: docs/concepts/staged-run.md
      - Plan binding: docs/concepts/plan-binding.md
      - Pull-request checks: docs/concepts/pr-checks.md
      - The risk gate: docs/concepts/risk-gate.md
      - The ledger: docs/concepts/ledger.md
      - Drift and re-scan: docs/concepts/drift.md
      - The cockpit: docs/concepts/cockpit.md
  - Reference:
      - Documentation index: docs/README.md
      - .ayasee.yaml: docs/reference/ayasee-yaml.md
      - Databricks policy pack: docs/reference/policy-pack.md
      - Cockpit setup: docs/cockpit/setup.md
      - Azure stage identity module: modules/azure-stage-identity/README.md
      - GitHub environments module: modules/github-environments/README.md
  - Compliance:
      - DORA RTS 2024/1774 Article 17: docs/compliance/dora-art17.md
      - Security policy and threat model: SECURITY.md
  - Project:
      - Design decisions: docs/governance/decisions.md
      - Provenance and licence: docs/governance/PROVENANCE.md
      - Governance: GOVERNANCE.md
      - Contributing: CONTRIBUTING.md
      - Releasing: docs/guides/releasing.md
      - End-to-end scenarios:
          - e2e/README.md
          - GitHub Enterprise Server suite: e2e/ghes/README.md
      - Changelog: CHANGELOG.md
